<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101211">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Play on Sound">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0}</style></head><body>
<title>Play on Sound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark mixing console for live cue-ups. Portrait stacks header, mixer, Music, Sound Effects and Spotify. Landscape puts Music and Sound Effects side by side under a one-row mixer. Editing opens a dialog. */
:root {
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  --bg: #101211;
  --panel: #191c1a;
  --panel-2: #222623;
  --edge: #2e332f;
  --ink: #e6e9e3;
  --muted: #8f9992;
  --pad: #292e2b;
  --pad-empty: #151816;
  --pad-ink: #e8ebe4;
  --accent: #f2a007;
  --accent-ink: #2a1c00;
  --lcd: #1f2d1a;
  --lcd-ink: #b9e08c;
  --live: #ff5a4d;
  --danger: #c8433a;
  --focus: #7aa7ff;
  --sp: #5dbb63;
  --c1: #e8a21a; --c1i: #2a1c00;
  --c2: #1f8f86; --c2i: #ffffff;
  --c3: #c8433a; --c3i: #ffffff;
  --c4: #4468cf; --c4i: #ffffff;
  --c5: #3f7f2a; --c5i: #ffffff;
  --display: "Chakra Petch", ui-sans-serif, system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  font-size: 14px;
  line-height: 1.5;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  touch-action: manipulation;
  -webkit-touch-callout: none;
}
body.modal { overflow: hidden; }
[hidden] { display: none !important; }
button, input, output, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.device { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.secs { display: flex; flex-direction: column; gap: 12px; }

.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.brand { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px; }
.logo { flex: 0 0 auto; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)); }
.bt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sub { font-family: var(--mono); font-size: 11px; line-height: 1.2; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head h1 { margin: 0; font-size: 20px; line-height: 1; font-weight: 600; white-space: nowrap; display: flex; flex-direction: column; gap: 4px; }
.h1a { font-family: var(--mono); font-size: 0.55em; font-weight: 500; letter-spacing: 0.42em; color: var(--muted); }
.h1b { font-size: 1.15em; letter-spacing: 0.22em; background: linear-gradient(100deg, #ffe0a0 0%, #f2a007 75%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.lcd {
  order: 3;
  flex: 1 1 100%;
  min-width: 0;
  background: var(--lcd);
  color: var(--lcd-ink);
  border-radius: 6px;
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.4;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}
.lcd div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbtn {
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  padding: 6px 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.tbtn:disabled { opacity: 0.4; cursor: default; }
.tbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 12px; }
.empty-note { font-size: 13px; color: var(--muted); text-wrap: pretty; }
.empty-note strong { color: var(--ink); font-weight: 600; }

.mixer { display: flex; flex-direction: column; gap: 12px; }
.mixgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.mix { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mix label { display: flex; justify-content: space-between; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mix output { color: var(--ink); font-variant-numeric: tabular-nums; }
.mixh { display: flex; align-items: center; gap: 6px; }
.mixh label { flex: 1 1 auto; min-width: 0; }
.lockb { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 30px; height: 24px; padding: 0; background: none; border: 1px solid var(--edge); border-radius: 6px; color: var(--muted); }
.lockb:disabled { opacity: 0.4; cursor: default; }
.lockb .sh { transform: translateY(-2px); }
.lockb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.lockb[aria-pressed="true"] .sh { transform: none; }
input[type="range"]:disabled { opacity: 0.45; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; min-height: 24px; }
.mbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  padding: 7px 14px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink);
}
a.btn { display: inline-block; text-decoration: none; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.danger { background: var(--danger); border-color: transparent; color: #fff; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sechead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.sechead h2 { margin: 0; font-size: 13px; font-family: var(--mono); font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.sechead .btns { display: flex; gap: 6px; }
.sechead .btn { padding: 4px 10px; font-size: 13px; }

.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
.tab { position: relative; background: transparent; border: 0; border-radius: 7px; padding: 6px 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 500; }
.tab.live::after { content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

.pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { position: relative; min-width: 0; max-width: 100%; --ar: 0.8; --arm: 1; }
.slot::before { content: ""; display: block; padding-top: calc(var(--ar) * var(--arm) * 100%); }
body[data-pad="low"] .slot { --arm: 0.8; }
body[data-pad="tall"] .slot { --arm: 1.25; }
.pad {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 100%;
  background: var(--pad);
  color: var(--pad-ink);
  border: 0;
  border-radius: 8px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.pad[data-c="1"] { background: var(--c1); color: var(--c1i); }
.pad[data-c="2"] { background: var(--c2); color: var(--c2i); }
.pad[data-c="3"] { background: var(--c3); color: var(--c3i); }
.pad[data-c="4"] { background: var(--c4); color: var(--c4i); }
.pad[data-c="5"] { background: var(--c5); color: var(--c5i); }
.pad.empty { background: var(--pad-empty); color: var(--muted); box-shadow: inset 0 0 0 1px var(--edge); }
.pad.playing { box-shadow: inset 0 0 0 3px #fff, inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.plink { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; display: block; border-radius: 8px; }
.plink[hidden] { display: none; }
.editing .pad { outline: 1px dashed var(--muted); outline-offset: 2px; }
.assigning .pad { outline: 2px dashed var(--accent); outline-offset: 2px; }
.pt { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.pn { font-family: var(--mono); font-size: 11px; opacity: 0.75; }
.pk { font-family: var(--mono); font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; opacity: 0.7; line-height: 1.3; }
.ps { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; border-radius: 3px; padding: 0 4px; background: rgba(0, 0, 0, 0.35); color: #fff; line-height: 1.4; }
.ps[hidden] { display: none; }
.ps:not([hidden]) ~ .pk { display: none; }
.pname {
  flex: 1 1 auto;
  min-height: 0;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.25;
  overflow: hidden;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.prog { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 3px; border-radius: 2px; background: rgba(0, 0, 0, 0.3); overflow: hidden; }
.prog i { display: block; height: 100%; width: 100%; background: rgba(255, 255, 255, 0.92); transform-origin: left; transform: scaleX(0); }
.pad:not(.playing) .prog { visibility: hidden; }
.pk { display: none; }
.keys-on .pk { display: block; }
.nobars .prog { display: none; }
@media (hover: hover) {
  .tbtn:hover { background: var(--edge); }
  .btn:hover:not(:disabled) { background: var(--edge); }
  .btn.danger:hover:not(:disabled) { background: var(--danger); filter: brightness(1.1); }
  .btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  .tab:hover { background: var(--panel-2); color: var(--ink); }
  .pad:hover { filter: brightness(1.1); }
  .pad.empty:hover { filter: none; background: var(--panel); }
  .mrow:hover:not(:disabled) { background: var(--edge); }
}

/* Spotify */
.sform { display: flex; gap: 8px; }
.sform input {
  flex: 1 1 0;
  min-width: 0;
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 16px;
}
.spnote { font-size: 12px; color: var(--muted); text-wrap: pretty; min-height: 1.4em; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.spnote:empty { display: none; }
.splist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.splist:empty { display: none; }
.spitem { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; }
.spmeta { display: flex; flex-direction: column; min-width: 0; flex: 1 1 180px; }
.sptype { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--sp); }
.sptitle { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spsub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.spbtns .btn { padding: 4px 10px; font-size: 13px; }

.sec[hidden] { display: none; }

/* menu */
.sheet { width: 100%; max-width: 480px; height: min(640px, 100%); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; }
.sheet:focus { outline: none; }
.shead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
.shead h2 { flex: 1 1 auto; margin: 0; text-align: center; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: 0.14em; color: var(--muted); }
.shead .btn { padding: 5px 12px; font-size: 13px; min-width: 66px; }
.shead .btn.off { visibility: hidden; }
.sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 12px 14px; }
.mmsg { padding: 8px 14px; border-top: 1px solid var(--edge); background: var(--lcd); color: var(--lcd-ink); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.mmsg:empty { display: none; }
.mgrp { display: flex; flex-direction: column; background: var(--panel-2); border-radius: 10px; overflow: hidden; margin-top: 12px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 8px 14px; background: none; border: 0; border-top: 1px solid var(--edge); border-radius: 0; text-align: left; color: var(--ink); font-size: 15px; }
.mrow:first-child { border-top: 0; }
.mrow:disabled { opacity: 0.4; cursor: default; }
.mrow .mt { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
.mrow small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.mrow .chev::after { content: "\203A"; font-size: 20px; color: var(--muted); }
.mrow.col { flex-direction: column; align-items: stretch; gap: 4px; }
.mrow .mtop { display: flex; justify-content: space-between; gap: 8px; }
.mrow output { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.mrow.cur .mt span::before { content: "\25CF  "; color: var(--accent); }
.pill { font-family: var(--mono); font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--edge); }
.mrow[aria-checked="true"] .pill { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.seg { display: flex; gap: 4px; flex: 0 0 auto; }
.sbtn { background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.sbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.mnote { margin: 8px 2px 0; font-size: 12px; color: var(--muted); text-wrap: pretty; }
.mtext { margin: 10px 2px 0; font-size: 14px; line-height: 1.6; text-wrap: pretty; }
.mh { margin: 16px 2px 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
.mlist { margin: 6px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
.mlist kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--edge); border-radius: 3px; padding: 0 4px; }
.minput { display: block; width: 100%; background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; font-size: 16px; margin-top: 10px; }
.pin { -webkit-text-security: disc; text-security: disc; letter-spacing: 0.3em; }
.mact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.mact .btn { padding: 9px 16px; }

/* edit dialog */
.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.overlay[hidden] { display: none; }
.dialog {
  width: 100%;
  max-width: 480px;
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dialog:focus { outline: none; }
.dialog h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.dcols { display: flex; flex-direction: column; gap: 10px; }
.dcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.frow { display: grid; grid-template-columns: 98px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.frow .fl { font-size: 13px; }
.frow output { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.frow .wide { grid-column: 2 / -1; min-width: 0; }
.fbtn, .dialog input[type="text"], .dialog select {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 16px;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; padding: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.dialog details { border-top: 1px solid var(--edge); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.dialog summary { cursor: pointer; font-size: 13px; padding: 2px 0; }
.dialog details[open] summary { margin-bottom: 6px; }
.drow { display: flex; flex-wrap: wrap; gap: 8px; }
.drow .btn { padding: 5px 12px; font-size: 13px; }
.dfoot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px; border-top: 1px solid var(--edge); position: sticky; bottom: -14px; background: var(--panel); margin-bottom: -14px; padding-bottom: 14px; }
.dnote { font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; }

@media (max-width: 360px) {
  .logo { width: 38px; height: 38px; }
  .brand { gap: 8px; }
  .h1b { letter-spacing: 0.1em; }
  .h1a { letter-spacing: 0.28em; }
  .head .tbtn { padding: 6px 9px; }
}
@media (max-width: 400px) {
  .head h1 { font-size: 17px; }
  .frow { grid-template-columns: 94px minmax(0, 1fr) auto; }
}

/* Layout follows the size of the space, not the device orientation, so it also holds in a narrow pane or after rotating. */
@media (min-width: 520px) {
  .mixgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 640px) {
  .head { flex-wrap: nowrap; }
  .brand { flex: 0 0 auto; }
  .lcd { order: 0; flex: 1 1 0; }
  .dialog { max-width: 780px; }
  .dcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; align-items: start; }
}
/* wide: Music and Sound Effects side by side, mixer in one row */
@media (min-width: 720px) {
  .device { max-width: 1120px; }
  .secs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .mixer { flex-direction: row; align-items: center; gap: 16px; }
  .mixgrid { flex: 1 1 auto; }
  .mbtns { flex: 0 1 auto; justify-content: flex-end; }
  .slot { --ar: 0.6667; }
}
/* short: pads in 6 columns x 2 rows and tighter spacing so the console fits one screen */
@media (max-height: 520px) {
  body { padding-block: 8px; }
  .device, .secs { gap: 8px; }
  .panel { padding: 8px; }
  .sec { gap: 6px; }
  .head h1 { font-size: 17px; }
  .mix label { font-size: 10px; }
  input[type="range"] { min-height: 20px; }
  .btn { padding: 5px 10px; }
  .pads { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .slot { --ar: 0.8; }
  .pad { padding: 4px; gap: 1px; }
  .pn, .pk { font-size: 9px; }
  .pname { font-size: 10.5px; line-height: 1.2; -webkit-line-clamp: 2; }
  .empty-note { font-size: 12px; padding: 6px 10px; }
  .prog { left: 4px; right: 4px; bottom: 4px; }
  .tab { padding: 4px 0; font-size: 11px; }
  .dialog { padding: 10px; gap: 6px; }
  .dcols, .dcol { gap: 6px; }
  .dfoot { bottom: -10px; margin-bottom: -10px; padding-bottom: 10px; padding-top: 6px; }
  .sw { width: 26px; height: 26px; }
}
</style>

<main class="device">
  <header class="head">
    <div class="brand"><svg class="logo" viewBox="0 0 48 48" width="46" height="46" role="img" aria-label="Play on Sound">
      <defs>
        <linearGradient id="lgT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c322e"/><stop offset="1" stop-color="#111412"/></linearGradient>
        <linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd37a"/><stop offset="1" stop-color="#f2a007"/></linearGradient>
        <radialGradient id="lgG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f2a007" stop-opacity="0.5"/><stop offset="1" stop-color="#f2a007" stop-opacity="0"/></radialGradient>
      </defs>
      <rect x="1" y="1" width="46" height="46" rx="13" fill="url(#lgT)" stroke="#3a403c" stroke-width="1.5"/>
      <circle cx="19" cy="24" r="17" fill="url(#lgG)"/>
      <path d="M12 14.5v19a1.5 1.5 0 0 0 2.3 1.3l15-9.5a1.5 1.5 0 0 0 0-2.6l-15-9.5A1.5 1.5 0 0 0 12 14.5z" fill="url(#lgA)"/>
      <path d="M33.5 18a9 9 0 0 1 0 12" fill="none" stroke="#f2a007" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M38 12.5a16 16 0 0 1 0 23" fill="none" stroke="#f2a007" stroke-opacity="0.5" stroke-width="2.6" stroke-linecap="round"/>
    </svg><div class="bt"><h1 aria-label="Play on Sound"><span class="h1a" aria-hidden="true">PLAY ON</span><span class="h1b" aria-hidden="true">SOUND</span></h1><div class="sub" id="projName"></div></div></div>
    <div class="lcd" role="status">
      <div id="lcd1"></div>
      <div id="lcd2" aria-live="polite"></div>
    </div>
    <button type="button" class="tbtn" id="editBtn" aria-pressed="false">編集</button>
    <button type="button" class="tbtn" id="menuBtn" aria-haspopup="dialog">メニュー</button>
  </header>

  <section class="panel empty-note" id="empty" hidden>
    <strong>パッドはまだ空です。</strong>
    「編集」をオンにしてパッドをタップすると、音声ファイルを読み込めます。音声ファイルはパッドへのドラッグ＆ドロップでも読み込めます。下の Spotify から、曲やプレイリストを開くパッドも作れます。
  </section>

  <section class="panel mixer" aria-label="ミキサー">
    <div class="mixgrid" id="mixgrid"></div>
    <div class="mbtns">
      <button type="button" class="btn" id="soundBtn" aria-pressed="true">音 ON</button>
      <button type="button" class="btn danger" id="stopAll">全停止</button>
      <button type="button" class="btn" id="fadeAll">フェード停止</button>
      <button type="button" class="btn" id="lockAll" aria-pressed="false">全ロック</button>
    </div>
  </section>

  <div id="secs" class="secs"></div>

  <section class="panel sec" id="spot" aria-label="Spotify">
    <div class="sechead"><h2>Spotify</h2></div>
    <form class="sform" id="spForm">
      <input id="spQ" type="text" placeholder="曲名・アーティスト名、または Spotify のリンク" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Spotify を検索">
      <button type="submit" class="btn primary" id="spGo">検索</button>
    </form>
    <div class="spnote" id="spNote"></div>
    <ul class="splist" id="spList"></ul>
    <div class="spnote" id="spHelp">Spotify のパッドをタップすると、Spotify（アプリまたはWeb）で曲やプレイリストが開きます。音はこのページでは鳴りません。</div>
  </section>

</main>

<div class="overlay" id="dlg" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1">
    <h2 id="dTitle"></h2>
    <div class="dcols">
      <div class="dcol">
        <div class="frow"><span class="fl">ファイル</span><button type="button" class="fbtn wide" id="dFile">ファイルを選択</button></div>
        <div class="frow"><label class="fl" for="dName">表示名</label><input id="dName" class="wide" type="text" maxlength="24" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="frow"><label class="fl" for="dSpot">Spotify</label><input id="dSpot" class="wide" type="text" placeholder="https://open.spotify.com/…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
        <div class="frow">
          <label class="fl" for="dMode">再生方法</label>
          <select id="dMode" class="wide">
            <option value="free">無制限（重ね再生）</option>
            <option value="drum">ドラム（押すたび頭出し）</option>
            <option value="toggle">トグル（押して再生／停止）</option>
            <option value="hold">押している間だけ</option>
          </select>
        </div>
        <div class="frow"><span class="fl">ループ</span><label class="check wide"><input type="checkbox" id="dLoop"> 繰り返し再生する</label></div>
        <div class="frow"><span class="fl" id="dColorL">色</span><div class="swatches wide" id="swatches" role="group" aria-labelledby="dColorL"></div></div>
      </div>
      <div class="dcol">
        <div id="dSliders" style="display:flex;flex-direction:column;gap:6px"></div>
        <details>
          <summary>イコライザ</summary>
          <div id="dEq" style="display:flex;flex-direction:column;gap:6px"></div>
        </details>
        <div class="drow">
          <button type="button" class="btn" id="dPrev">試聴</button>
          <button type="button" class="btn" id="dCopy">コピー</button>
          <button type="button" class="btn" id="dPaste">貼り付け</button>
          <button type="button" class="btn" id="dReset">設定をリセット</button>
          <button type="button" class="btn" id="dDel">音声・リンクを外す</button>
        </div>
      </div>
    </div>
    <div class="dnote" id="dNote"></div>
    <input id="dFileIn" type="file" accept="audio/*" hidden>
    <div class="dfoot">
      <button type="button" class="btn" id="dCancel">キャンセル</button>
      <button type="button" class="btn primary" id="dOk">決定</button>
    </div>
  </div>
</div>

<div class="overlay" id="menu" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
    <div class="shead">
      <button type="button" class="btn" id="mBack">戻る</button>
      <h2 id="mTitle">メニュー</h2>
      <button type="button" class="btn" id="mClose">閉じる</button>
    </div>
    <div class="sbody" id="mBody"></div>
    <div class="mmsg" id="mMsg" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SECS = ['音楽', '効果音'];
  var SEC_EN = ['MUSIC', 'SOUND EFFECTS'];
  var NB = 5, PER = 12;
  var KEYS = [
    ['1', '2', '3', '4', 'Q', 'W', 'E', 'R', 'A', 'S', 'D', 'F'],
    ['7', '8', '9', '0', 'U', 'I', 'O', 'P', 'J', 'K', 'L', ';']
  ];
  var CODES = [
    ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyA', 'KeyS', 'KeyD', 'KeyF'],
    ['Digit7', 'Digit8', 'Digit9', 'Digit0', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon']
  ];
  var COLORS = ['グレー', '琥珀', '青緑', '赤', '青', '緑'];
  var MODES = ['free', 'drum', 'toggle', 'hold'];
  var MODE_SHORT = { free: '重ね再生', drum: 'ドラム', toggle: 'トグル', hold: '押下中のみ' };
  var SPOT_TYPES = { track: '曲', album: 'アルバム', artist: 'アーティスト', playlist: 'プレイリスト', show: '番組', episode: 'エピソード' };
  var LS = 'pad-eight-project-v3';
  var LSI = 'pad-eight-index-v1', LSP = 'pad-eight-prefs-v1';
  var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var FIELDS = ['name', 'color', 'file', 'hasAudio', 'raw', 'buffer', 'mode', 'loop', 'vol', 'pan', 'start', 'fadeIn', 'fadeOut'];

  function $(id) { return document.getElementById(id); }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function num(x, a, b, d) { x = Number(x); return isFinite(x) ? clamp(x, a, b) : d; }

  /* ---------- Spotify links ---------- */
  function parseSpotify(text) {
    text = String(text || '').trim();
    var m = text.match(/^spotify:(track|album|artist|playlist|show|episode):([A-Za-z0-9]{10,32})$/);
    if (m) return { type: m[1], id: m[2], uri: 'spotify:' + m[1] + ':' + m[2] };
    var u;
    try { u = new URL(text); } catch (e) { return null; }
    if (u.protocol !== 'https:' || u.hostname !== 'open.spotify.com') return null;
    var seg = u.pathname.split('/').filter(Boolean);
    if (seg.length && /^intl-/.test(seg[0])) seg.shift();
    if (seg.length < 2) return null;
    if (!SPOT_TYPES[seg[0]] || !/^[A-Za-z0-9]{10,32}$/.test(seg[1])) return null;
    return { type: seg[0], id: seg[1], uri: 'spotify:' + seg[0] + ':' + seg[1] };
  }
  function spotUrl(uri) {
    var p = parseSpotify(uri);
    return p ? 'https://open.spotify.com/' + p.type + '/' + p.id : '';
  }
  function spotType(uri) {
    var p = parseSpotify(uri);
    return p ? SPOT_TYPES[p.type] : '';
  }

  /* ---------- Project model ---------- */
  function newButton(sec, bk, idx) {
    return {
      sec: sec, bk: bk, idx: idx, isDraft: false,
      name: '', color: 5, file: '', hasAudio: false, spot: null,
      raw: null, buffer: null, _dec: null, _bad: false, _held: false,
      mode: sec === 0 ? 'toggle' : 'free', loop: false,
      vol: 1, pan: 0, start: 0, fadeIn: 0, fadeOut: 0, eq: [0, 0, 0]
    };
  }
  /* the default pad settings; full = also name and colour (used when a sound or link is removed) */
  function setDefaults(b, full) {
    b.mode = b.sec === 0 ? 'toggle' : 'free';
    b.loop = false; b.vol = 1; b.pan = 0; b.start = 0; b.fadeIn = 0; b.fadeOut = 0; b.eq = [0, 0, 0];
    if (full) { b.color = 5; b.name = ''; }
  }
  function emptyProject() {
    var banks = [];
    for (var s = 0; s < 2; s++) {
      var bks = [];
      for (var k = 0; k < NB; k++) {
        var row = [];
        for (var i = 0; i < PER; i++) row.push(newButton(s, k, i));
        bks.push(row);
      }
      banks.push(bks);
    }
    return { banks: banks, page: [0, 0], xf: false, fade: 0, master: 1, vols: [1, 1], on: true, locks: [false, false, false, false] };
  }

  function ser(b) {
    return { n: b.name, c: b.color, f: b.file, a: b.hasAudio ? 1 : 0, m: b.mode, l: b.loop ? 1 : 0,
      v: b.vol, p: b.pan, s: b.start, fi: b.fadeIn, fo: b.fadeOut, e: b.eq,
      sp: b.spot ? { u: b.spot.uri, t: b.spot.title, s: b.spot.sub } : null };
  }
  function fill(b, o) {
    if (o.d) return; /* a built-in demo pad from an earlier version: leave it empty */
    if (!o.n && !o.a && !o.sp) return; /* blank pad: keep the defaults */
    b.name = String(o.n || '').slice(0, 24);
    b.color = clamp(o.c | 0, 0, 5);
    b.file = String(o.f || '').slice(0, 80);
    b.hasAudio = !!o.a;
    b.mode = MODES.indexOf(o.m) >= 0 ? o.m : b.mode;
    b.loop = !!o.l;
    b.vol = num(o.v, 0, 1, 1);
    b.pan = num(o.p, -1, 1, 0);
    b.start = num(o.s, 0, 3600, 0);
    b.fadeIn = num(o.fi, 0, 8, 0);
    b.fadeOut = num(o.fo, 0, 8, 0);
    if (Array.isArray(o.e)) b.eq = [0, 1, 2].map(function (k) { return num(o.e[k], -12, 12, 0); });
    var sp = o.sp && parseSpotify(o.sp.u);
    b.spot = sp ? { uri: sp.uri, title: String(o.sp.t || '').slice(0, 80), sub: String(o.sp.s || '').slice(0, 80) } : null;
    if (b.spot) b.hasAudio = false;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  function pkey(id) { return id === 'main' ? LS : 'pad-eight-proj-' + id; }
  function newId() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function loadIndex() {
    var j = null;
    try { j = JSON.parse(lsGet(LSI)); } catch (e) { j = null; }
    var list = [];
    if (j && Array.isArray(j.list)) {
      j.list.forEach(function (x) {
        if (x && typeof x.id === 'string' && /^[A-Za-z0-9]{1,24}$/.test(x.id)) list.push({ id: x.id, name: String(x.name || '').slice(0, 30) || '無題' });
      });
    }
    if (!list.length) list = [{ id: 'main', name: 'プロジェクト1' }];
    var cur = list[0].id;
    if (j) list.forEach(function (x) { if (x.id === j.cur) cur = x.id; });
    return { cur: cur, list: list };
  }
  function loadPrefs() {
    var o = null;
    try { o = JSON.parse(lsGet(LSP)); } catch (e) { o = null; }
    o = o || {};
    var a = o.adm || {};
    return {
      keys: o.keys === true || o.keys === false ? o.keys : null,
      bars: o.bars !== false,
      pad: ['low', 'normal', 'tall'].indexOf(o.pad) >= 0 ? o.pad : 'normal',
      wake: !!o.wake,
      ios: o.ios !== false,
      maxv: num(o.maxv, 4, 32, 20) | 0,
      adm: { on: !!(a.on && a.hash), salt: String(a.salt || ''), hash: String(a.hash || '') }
    };
  }
  var PF = loadPrefs();
  function savePrefs() { lsSet(LSP, JSON.stringify(PF)); }

  function loadProject(id) {
    try {
      var j = JSON.parse(lsGet(pkey(id)));
      if (!j || !Array.isArray(j.banks) || j.banks.length !== 2) return null;
      var Q = emptyProject();
      Q.id = id;
      Q.page = [clamp((j.page && j.page[0]) | 0, 0, NB - 1), clamp((j.page && j.page[1]) | 0, 0, NB - 1)];
      Q.xf = j.xf === true;
      Q.fade = num(j.fade, 0, 8, 0);
      Q.master = j.mv === 2 ? num(j.master, 0, 1, 1) : 1;
      Q.on = j.on !== false;
      if (Array.isArray(j.lk)) Q.locks = [0, 1, 2, 3].map(function (k) { return j.lk[k] === true; });
      if (Array.isArray(j.vols)) Q.vols = [num(j.vols[0], 0, 1, 1), num(j.vols[1], 0, 1, 1)];
      for (var s = 0; s < 2; s++) {
        for (var k = 0; k < NB; k++) {
          for (var i = 0; i < PER; i++) {
            var o = j.banks[s] && j.banks[s][k] && j.banks[s][k][i];
            if (o) fill(Q.banks[s][k][i], o);
          }
        }
      }
      return Q;
    } catch (e) { return null; }
  }
  function serProject(p) {
    return {
      mv: 2, lk: p.locks, page: p.page, xf: p.xf, fade: p.fade, master: p.master, vols: p.vols, on: p.on,
      banks: p.banks.map(function (sec) { return sec.map(function (bk) { return bk.map(ser); }); })
    };
  }
  var saveT = null;
  function saveIndex() { return lsSet(LSI, JSON.stringify(IDX)); }
  function saveNow() {
    clearTimeout(saveT);
    if (!IDX.list.some(function (x) { return x.id === S.id; })) return false;
    var ok = lsSet(pkey(S.id), JSON.stringify(serProject(S)));
    return saveIndex() && ok;
  }
  function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 250); }

  /* ---------- Stored audio (IndexedDB) ---------- */
  var dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('pad-eight-3', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('audio'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  function idb(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('audio', mode);
        var req = fn(tx.objectStore('audio'));
        tx.oncomplete = function () { res(req ? req.result : undefined); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function baseKey(b) { return b.sec + '-' + b.bk + '-' + b.idx; }
  function keyFor(id, k) { return id === 'main' ? k : id + '/' + k; }
  function bkey(b) { return keyFor(S.id, baseKey(b)); }
  function idbDelProject(id) {
    var range = id === 'main' ? IDBKeyRange.bound('0', '2', false, true) : IDBKeyRange.bound(id + '/', id + '/\uffff');
    return idb('readwrite', function (st) { return st.delete(range); });
  }
  function idbPut(k, v) { return idb('readwrite', function (s) { return s.put(v, k); }); }
  function idbGet(k) { return idb('readonly', function (s) { return s.get(k); }); }
  function idbDel(k) { return idb('readwrite', function (s) { return s.delete(k); }); }
  function idbClear() { return idb('readwrite', function (s) { return s.clear(); }); }

  /* ---------- Audio engine ---------- */
  var ctx = null, master = null, secGain = [];
  var voices = [];
  var heldBy = {};

  function applyGain() {
    if (!ctx) return;
    master.gain.value = S.on ? S.master : 0;
    secGain[0].gain.value = S.vols[0];
    secGain[1].gain.value = S.vols[1];
  }
  function ensure() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain();
      var comp = ctx.createDynamicsCompressor();
      master.connect(comp);
      comp.connect(ctx.destination);
      secGain = [ctx.createGain(), ctx.createGain()];
      secGain[0].connect(master);
      secGain[1].connect(master);
      applyGain();
    }
    if (ctx.state !== 'running') {
      try { var rp = ctx.resume(); if (rp && rp.catch) rp.catch(function () {}); } catch (e) { /* ignore */ }
    }
    return ctx;
  }
  /* iOS: the audio context only starts after a touchend/click, so unlock it there with a silent buffer. */
  function unlock() {
    var c = ensure();
    try {
      var sb = c.createBuffer(1, 1, 22050), ss = c.createBufferSource();
      ss.buffer = sb; ss.connect(c.destination); ss.start(0);
    } catch (e) { /* ignore */ }
  }
  ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { if (!(ctx && ctx.state === 'running')) unlock(); }, true);
  });
  function decode(ab) {
    return new Promise(function (res, rej) {
      var p;
      try { p = ctx.decodeAudioData(ab, res, rej); } catch (e) { rej(e); return; }
      if (p && typeof p.then === 'function') p.then(res, rej);
    });
  }
  function readBuf(file) {
    if (file.arrayBuffer) return file.arrayBuffer();
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
      r.readAsArrayBuffer(file);
    });
  }
  /* keep decoded audio within a memory budget (iOS tabs get killed when they use too much) */
  function bufBytes(buf) { return buf.length * buf.numberOfChannels * 4; }
  function trim(keep) {
    var list = [], total = 0;
    eachBtn(function (b) { if (b.buffer) { total += bufBytes(b.buffer); list.push(b); } });
    var budget = IS_IOS ? 150e6 : 500e6;
    if (total <= budget) return;
    list.sort(function (x, y) { return (x._used || 0) - (y._used || 0); });
    for (var i = 0; i < list.length && total > budget; i++) {
      var b = list[i];
      if (b === keep || !b.raw) continue;
      if (voices.some(function (v) { return v.b === b; })) continue;
      total -= bufBytes(b.buffer);
      b.buffer = null; b._dec = null;
    }
  }
  function applyAudioSession() {
    try { if (navigator.audioSession) navigator.audioSession.type = PF.ios ? 'playback' : 'auto'; } catch (e) { /* ignore */ }
  }
  var wl = null;
  function applyWake() {
    try {
      if (PF.wake && navigator.wakeLock && !wl && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (l) {
          wl = l;
          l.addEventListener('release', function () { if (wl === l) wl = null; });
        }).catch(function () {});
      } else if (!PF.wake && wl) {
        wl.release().catch(function () {});
        wl = null;
      }
    } catch (e) { /* ignore */ }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      applyWake();
      if (ctx && ctx.state !== 'running') { try { ctx.resume(); } catch (e) { /* ignore */ } }
    }
  });

  function hasSound(b) { return !!(b.raw || b.buffer); }

  function needBuffer(b) {
    if (b.buffer) return Promise.resolve(b.buffer);
    if (b._bad) return Promise.resolve(null);
    if (b.raw) {
      if (!b._dec) {
        b._dec = decode(b.raw.slice(0)).then(function (buf) {
          b.buffer = buf;
          b._used = Date.now();
          trim(b);
          return buf;
        }).catch(function () {
          b._bad = true;
          return null;
        });
      }
      return b._dec;
    }
    return Promise.resolve(null);
  }

  function startVoice(b, fadeInOverride) {
    var c = ctx;
    var active = voices.filter(function (v) { return !v.stopping; });
    while (active.length >= PF.maxv) { stopVoice(active.shift(), 0.03); }
    var t = c.currentTime + 0.005;
    var buf = b.buffer;

  var TITLES = { root: 'メニュー', 'new': '新規作成', open: '開く', saveas: '名前を付けて保存', del: '削除', delc: '削除の確認', display: '表示', settings: '設定', erase: 'データの消去', admin: '管理者モード', features: '機能', help: 'Web説明' };
  var SCREENS = {};

  SCREENS.root = function () {
    var lk = isLocked();
    var g = group();
    row(g, '新規作成', '空のプロジェクトを作る', function () { go('new'); }, { disabled: lk });
    row(g, '開く', IDX.list.length + ' 件のプロジェクト', function () { go('open'); });
    row(g, '上書き保存', curName(), function () {
      mmsg(saveNow() ? '「' + curName() + '」を保存しました' : '保存できませんでした（ブラウザの保存領域がいっぱいかもしれません）');
    }, { noChev: true });
    row(g, '名前を付けて保存', '音声も含めて複製します', function () { go('saveas'); }, { disabled: lk });
    row(g, '削除', 'プロジェクトを削除', function () { go('del'); }, { disabled: lk });
    var gf = group();
    row(gf, 'ファイルに書き出す', 'バックアップ。他の端末へ移せます', function () {
      mmsg('書き出し中…');
      exportProject().then(function () { mmsg('書き出しました'); }).catch(function (e) {
        var c = e && e.code;
        mmsg(c === 'declined' ? '書き出しをやめました' : c === 'unavailable' || c === 'not_granted' ? 'この表示ではファイルを保存できません' : '書き出せませんでした');
      });
    }, { noChev: true });
    row(gf, 'ファイルから読み込む', '書き出したファイルを新しいプロジェクトとして開く', pickFile, { noChev: true, disabled: lk });
    var g2 = group();
    row(g2, '表示', 'キー表示・進行バー・パッドの高さ', function () { go('display'); });
    row(g2, '設定', '同時発音数・iPhone向け設定', function () { go('settings'); });
    row(g2, '管理者モード', PF.adm.on ? (lk ? 'ロック中' : 'ロック機能オン（解除中）') : 'PINで編集をロック', function () { go('admin'); });
    row(g2, '機能', null, function () { go('features'); });
    var g3 = group();
    row(g3, 'Web説明', '使い方とiPhone・iPadの注意', function () { go('help'); });
    note('プロジェクトは変更のたびに自動で保存されます。ブラウザ上のページなので「アプリの終了」はありません。ブラウザやタブを閉じてください。');
  };
  SCREENS['new'] = function () {
    text('新しい空のプロジェクトを作って切り替えます。今のプロジェクトは自動で保存されます。');
    var i = input(uniqueName('プロジェクト'), { label: 'プロジェクト名' });
    actions([{ t: '作成', cls: 'primary', fn: function () {
      newProject(i.value);
      closeMenu();
      setMsg('「' + curName() + '」を作りました');
    } }]);
  };
  SCREENS.open = function () {
    var g = group();
    IDX.list.forEach(function (x) {
      row(g, x.name, x.id === S.id ? '現在開いています' : null, function () {
        if (x.id !== S.id) openProject(x.id);
        closeMenu();
        setMsg('「' + curName() + '」を開きました');
      }, { cur: x.id === S.id, noChev: true });
    });
  };
  SCREENS.saveas = function () {
    text('今のプロジェクトを別の名前で保存し、そちらを開きます。読み込んだ音声も複製されます。');
    var i = input(uniqueName(curName() + ' コピー'), { label: '新しい名前' });
    var d = actions([{ t: '保存', cls: 'primary', fn: function () {
      var btn = d.firstChild;
      btn.disabled = true;
      saveAs(i.value).then(function () {
        mStack = ['root'];
        render();
        mmsg('「' + curName() + '」として保存しました');
      }).catch(function () {
        btn.disabled = false;
        mmsg('保存できませんでした（ブラウザの保存領域がいっぱいかもしれません）');
      });
    } }]);
  };
  SCREENS.del = function () {
    var g = group();
    IDX.list.forEach(function (x) {
      row(g, x.name, x.id === S.id ? '現在開いています' : null, function () { pendingDel = x.id; go('delc'); }, { cur: x.id === S.id });
    });
  };
  SCREENS.delc = function () {
    var nm = '';
    IDX.list.forEach(function (x) { if (x.id === pendingDel) nm = x.name; });
    if (!nm) { backMenu(); return; }
    text('「' + nm + '」を削除します。パッドの設定と読み込んだ音声も消え、元に戻せません。');
    actions([
      { t: '削除する', cls: 'danger', fn: function () {
        removeProject(pendingDel);
        pendingDel = null;
        mStack = ['root', 'del'];
        render();
        mmsg('削除しました');
      } },
      { t: 'キャンセル', fn: backMenu }
    ]);
  };
  SCREENS.display = function () {
    var g = group();
    segRow(g, 'キーの表示', [['auto', '自動'], ['on', '表示'], ['off', '非表示']], PF.keys === null ? 'auto' : (PF.keys ? 'on' : 'off'), function (v) {
      PF.keys = v === 'auto' ? null : v === 'on'; savePrefs(); applyPrefs();
    });
    toggleRow(g, '進行バー', 'パッド下の再生位置バー', PF.bars, function (v) { PF.bars = v; savePrefs(); applyPrefs(); });
    segRow(g, 'パッドの高さ', [['low', '低'], ['normal', '標準'], ['tall', '高']], PF.pad, function (v) { PF.pad = v; savePrefs(); applyPrefs(); });
    note('「キーの表示」の自動は、キーボードのある環境でだけパッドにキー名を出します。');
  };
  SCREENS.settings = function () {
    var g = group();
    var r = mk('div', 'mrow col');
    var top = mk('div', 'mtop');
    top.appendChild(mk('span', 'mt', '同時発音数'));
    var out = mk('output', '', String(PF.maxv));
    top.appendChild(out);
    var rg = document.createElement('input');
    rg.type = 'range'; rg.min = '4'; rg.max = '32'; rg.step = '1'; rg.value = String(PF.maxv);
    rg.setAttribute('aria-label', '同時発音数');
    rg.addEventListener('input', function () { PF.maxv = parseInt(rg.value, 10); out.textContent = String(PF.maxv); savePrefs(); });
    r.appendChild(top); r.appendChild(rg);
    g.appendChild(r);
    note('多いほど重ねて鳴らせますが、古い端末では音が途切れることがあります。');
    head('IPHONE / IPAD');
    var g2 = group();
    toggleRow(g2, '消音スイッチでも鳴らす', 'オフにすると、消音スイッチがオンの間は鳴りません。オンでは他アプリの音を止めることがあります', PF.ios, function (v) { PF.ios = v; savePrefs(); applyAudioSession(); });
    toggleRow(g2, '画面をスリープさせない', '演奏中に画面が消えるのを防ぎます（iOS 16.4以降）', PF.wake, function (v) { PF.wake = v; savePrefs(); applyWake(); });
    if (!isLocked()) {
      var g3 = group();
      row(g3, 'すべてのデータを消去', '全プロジェクトと音声を消します', function () { go('erase'); });
    }
  };
  SCREENS.erase = function () {
    if (isLocked()) { backMenu(); return; }
    text('すべてのプロジェクトと、読み込んだ音声を消去します。元に戻せません。');
    actions([
      { t: '消去する', cls: 'danger', fn: function () {
        eraseAll();
        mStack = ['root'];
        render();
        mmsg('消去しました');
      } },
      { t: 'キャンセル', fn: backMenu }
    ]);
  };
  SCREENS.admin = function () {
    if (!PF.adm.on) {
      text('PIN（4〜8桁の数字）を決めると、編集・Spotifyの検索・新規作成・保存・削除をロックできます。演奏と音量の操作はそのまま使えます。');
      var p1 = input('', { pin: true, max: 8, label: 'PIN' });
      var p2 = input('', { pin: true, max: 8, label: 'PINの確認' });
      actions([{ t: 'ロックを有効にする', cls: 'primary', fn: function () {
        if (!/^\d{4,8}$/.test(p1.value)) { mmsg('PINは4〜8桁の数字にしてください'); return; }
        if (p1.value !== p2.value) { mmsg('確認用のPINが一致しません'); return; }
        var salt = newId();
        hashPin(p1.value, salt).then(function (h) {
          PF.adm = { on: true, salt: salt, hash: h };
          savePrefs();
          adminOpen = true;
          applyLock();
          render();
          mmsg('設定しました。「今すぐロック」でロックします');
        });
      } }]);
      note('これは誤操作を防ぐための簡易ロックです。PINを忘れた場合は、ブラウザのサイトデータを消去するまで解除できません（プロジェクトも消えます）。');
    } else if (!adminOpen) {
      text('編集などがロックされています。PINを入力すると解除できます。');
      var pi = input('', { pin: true, max: 8, label: 'PIN' });
      actions([{ t: '解除', cls: 'primary', fn: function () {
        hashPin(pi.value, PF.adm.salt).then(function (h) {
          if (h === PF.adm.hash) {
            adminOpen = true;
            applyLock();
            render();
            mmsg('ロックを解除しました');
          } else {
            pi.value = '';
            mmsg('PINが違います');
          }
        });
      } }]);
    } else {
      var g = group();
      row(g, '今すぐロック', 'メニューを閉じてロックします', function () { adminOpen = false; applyLock(); closeMenu(); setMsg('ロックしました'); }, { noChev: true });
      row(g, 'ロック機能をやめる', 'PINを削除します', function () {
        PF.adm = { on: false, salt: '', hash: '' };
        savePrefs();
        applyLock();
        render();
        mmsg('ロック機能をやめました');
      }, { noChev: true });
    }
  };
  SCREENS.features = function () {
    list([
      '音楽・効果音それぞれ 5バンク × 12パッド',
      '再生方法：無制限（重ね再生）／ドラム／トグル／押している間だけ',
      'ループ、再生位置、フェードイン・アウト、バランス、3バンドのイコライザ',
      '音楽のクロスフェード、フェード停止、全停止',
      'マスター・音楽・効果音の音量とフェード時間',
      'Spotifyの曲・プレイリストを開くパッド（音はSpotify側で再生）',
      '複数プロジェクトの保存・切り替え・複製',
      'PINによる編集ロック'
    ]);
  };
  SCREENS.help = function () {
    head('基本');
    list([
      'パッドをタップで再生します。',
      '「編集」をオンにしてパッドをタップすると、音声ファイルの読み込みや各種設定ができます。',
      'マスターは100%が初期値です。全体の音量は端末本体の音量ボタンで調整してください（Webページから端末の音量は読み書きできません）。',
      'データはこのブラウザの中に保存されます。端末を変えるときは、メニューの「ファイルに書き出す」で保存し、移す先で「ファイルから読み込む」を使ってください。'
    ]);
    head('キーボード');
    list([
      [{ k: '1' }, { k: '2' }, { k: '3' }, { k: '4' }, ' / ', { k: 'Q' }, { k: 'W' }, { k: 'E' }, { k: 'R' }, ' / ', { k: 'A' }, { k: 'S' }, { k: 'D' }, { k: 'F' }, '：音楽'],
      [{ k: '7' }, { k: '8' }, { k: '9' }, { k: '0' }, ' / ', { k: 'U' }, { k: 'I' }, { k: 'O' }, { k: 'P' }, ' / ', { k: 'J' }, { k: 'K' }, { k: 'L' }, { k: ';' }, '：効果音'],
      [{ k: 'Esc' }, '：全停止']
    ]);
    head('IPHONE / IPAD');
    list([
      '最初にタップした時点で音が使えるようになります。鳴らないときは、もう一度タップしてください。',
      '消音スイッチがオンだと鳴らないことがあります。設定の「消音スイッチでも鳴らす」をオンにしてください。',
      '長い音声ファイルはメモリを多く使います。数分以内のファイルをおすすめします。',
      'ホーム画面に追加すると、全画面で使えます。',
      'しばらく使わないと、iOSがブラウザのデータを消すことがあります。大事なデータは、使う前に音声を読み込み直せる状態にしておいてください。'
    ]);
  };

  function render() {
    var name = mStack[mStack.length - 1];
    var st = name === lastScreen ? mBody.scrollTop : 0;
    lastScreen = name;
    mBody.textContent = '';
    mmsg('');
    $('mTitle').textContent = TITLES[name] || 'メニュー';
    $('mBack').classList.toggle('off', mStack.length < 2);
    SCREENS[name]();
    mBody.scrollTop = st;
  }
  function go(name) { mStack.push(name); render(); }
  function backMenu() {
    if (mStack.length > 1) { mStack.pop(); render(); } else closeMenu();
  }
  function openMenu() {
    if (editMode === false) { /* keep */ }
    mStack = ['root'];
    lastScreen = '';
    $('menu').hidden = false;
    document.body.classList.add('modal');
    render();
    $('sheet').focus();
  }
  function closeMenu() {
    $('menu').hidden = true;
    document.body.classList.remove('modal');
    lastScreen = '';
  }
  $('menuBtn').addEventListener('click', openMenu);
  $('mClose').addEventListener('click', closeMenu);
  $('mBack').addEventListener('click', backMenu);
  $('menu').addEventListener('click', function (e) { if (e.target === $('menu')) closeMenu(); });

  /* ---------- Keyboard ---------- */
  window.addEventListener('keydown', function (e) {
    if (!$('menu').hidden) {
      if (e.code === 'Escape') backMenu();
      return;
    }
    if (!$('dlg').hidden) {
      if (e.code === 'Escape') closeDlg();
      return;
    }
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' && e.target.type === 'text') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Escape') { stopAll(0.05); cancelAssign(false); return; }
    if (e.repeat || editMode || assigning) return;
    for (var s = 0; s < 2; s++) {
      var i = CODES[s].indexOf(e.code);
      if (i >= 0) {
        e.preventDefault();
        press(s, i, 'k' + e.code);
        return;
      }
    }
  });
  window.addEventListener('keyup', function (e) {
    release('k' + e.code);
  });
  window.addEventListener('blur', function () {
    Object.keys(heldBy).forEach(release);
  });

  /* ---------- Init ---------- */
  syncMixer();
  renderSec(0);
  renderSec(1);
  hydrate();
  applyPrefs();
  applyLock();
})();
</script>

<script>
/* offline support: cache the app files so it also opens without a connection */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body></html>
